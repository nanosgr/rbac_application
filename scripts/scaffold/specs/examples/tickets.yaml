# Spec de ejemplo — recurso `tickets` con scope por atributo (dimensión "team").
resource:
  singular: ticket
  plural: tickets
  label_singular: "Ticket"
  label_plural: "Tickets"
  icon: Ticket

fields:
  - { name: subject, type: string, optional: false }
  - { name: body, type: text, optional: true }
  - name: priority
    type: enum
    optional: false
    default: normal
    filterable: true
    enum_values:
      - { value: low, label: "Baja" }
      - { value: normal, label: "Normal" }
      - { value: high, label: "Alta" }
  # fechas: `date` (YYYY-MM-DD) y `datetime` (con hora). default: ISO, `today` o `now`.
  - { name: due_date, type: date, optional: true }
  - { name: reported_at, type: datetime, optional: false, default: now }

scoping:
  mode: attribute
  dimension: team

frontend:
  generate: true
  # alta/edición como página del dashboard: /tickets/new y /tickets/:id/edit
  form_mode: page

docs:
  update_claude_md: true
